paths:
  project_root: "."
  series_root: "Series"
  comfyui: "../00 - DO NOT LIST/ComfyUI_windows_portable/ComfyUI"
  ffmpeg: "ffmpeg"
  # Vendored automatically (git clone + its own venv) the first time train-character-lora runs.
  ai_toolkit: "runtime/ai-toolkit"

hardware:
  gpu_vram_gb: 6
  system_ram_gb: 32
  prefer_cpu_offload: true
  # How hard this machine renders while it's a worker: eco leaves headroom to use the
  # machine for other things at the same time (lower ComfyUI VRAM use, fewer render steps,
  # a pause between shots); full renders as fast as this hardware allows. balanced is in
  # between. Also sets comfyui_api.steps/cfg defaults unless those are set explicitly below.
  work_intensity: full   # eco | balanced | full
  # How long a worker may go quiet (no render-queue request reaching the coordinator) before
  # its in-progress shot is assumed abandoned and automatically returned to the queue.
  worker_timeout_seconds: 90

models:
  transcription_backend: faster_whisper
  vision_backend: llamacpp
  llm_backend: llamacpp
  tts_backend: xtts   # cloned original voices (XTTS-v2), reviewed via assign-voice
  video_backend: comfyui

transcription:
  backend: "faster_whisper"
  model: "medium"
  device: "cpu"
  compute_type: "int8"
  beam_size: 5

llm:
  # Project-local llama.cpp server (runtime/llamacpp) on its own port; started by start.py.
  # Models are plain GGUF files in models/llm - drop any GGUF there (or set model_file) to switch.
  base_url: "http://127.0.0.1:11435"
  model_file: null        # null = newest *.gguf in models/llm
  # Auto-downloaded (size + SHA-256 checked) when models/llm has no GGUF yet:
  hf_repo: "unsloth/Qwen3-8B-GGUF"
  hf_file: "Qwen3-8B-Q4_K_M.gguf"
  ctx_size: 16384
  gpu_layers: 99
  timeout_seconds: 1200   # generous: CPU fallback under concurrent GPU render load is slow

# Separater lokaler Vision-Dienst fuer Bild- und Video-Keyframes. Die Dateien werden beim
# SeriesAI-Setup direkt vom angegebenen Repository geladen, fortgesetzt und per SHA-256 geprueft.
# gpu_layers: 0 ist auf dem 6-GB-NAS bewusst CPU-sicher, damit Text-LLM und Render-Worker nicht abstuerzen.
vision:
  enabled: true
  base_url: "http://127.0.0.1:11436"
  hf_repo: "ggml-org/Qwen2.5-VL-3B-Instruct-GGUF"
  model_file: "Qwen2.5-VL-3B-Instruct-Q4_K_M.gguf"
  mmproj_file: "mmproj-Qwen2.5-VL-3B-Instruct-Q8_0.gguf"
  ctx_size: 4096
  gpu_layers: 0

# Optional local ComfyUI API renderer. Keep video_backend null until a local
# API workflow template has been exported and configured here.
comfyui_api:
  api_url: "http://127.0.0.1:8188"
  workflow_template: "workflows/ltx23_gguf_api.json"
  # Used instead of the above whenever a shot has a real reference face image, so generated
  # characters actually resemble the original cast instead of a generic text-only guess.
  img2video_workflow_template: "workflows/ltx23_img2video_api.json"
  poll_seconds: 2
  timeout_seconds: 7200
  # Leave unset (null) to derive both from hardware.work_intensity; set explicitly to pin
  # render quality regardless of the chosen intensity preset.
  steps: null
  cfg: null

# Optional local Piper executable and voice-model directory for test/dialogue
# synthesis. Voice cloning remains an explicit future backend choice.
piper:
  executable: "piper"
  models_root: null

# Character-LoRA training defaults (image/video identity). Aggressively low-VRAM for this
# 6GB card; ai-toolkit/diffusion-pipe normally recommend ~24GB for comfortable LTX-2 training.
training:
  rank: 8
  resolution: 512
  image_steps: 1500
  video_steps: 1000
  video_clip_frames: 25
  learning_rate: 0.0001
  batch_size: 1

processing:
  checkpoint_enabled: true
  max_job_retries: 3

localization:
  analysis_language: "de"
  output_language: "de"
